name: CleanGuard CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Pytest Suite
        run: |
          pytest --verbose

  build:
    name: Build Executable & Inno Setup Package
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          python scripts/build.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\cleanguard_setup.iss

      - name: Upload Standalone Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanGuard-Standalone-Windows
          path: dist/CleanGuard.exe
          if-no-files-found: error

      - name: Upload Installer Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanGuard-Setup-Installer
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CleanGuard.exe
            dist/installer/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
